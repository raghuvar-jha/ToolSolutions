  <circle cx="252" cy="44" r="14" fill="white" fill-opacity="0.18"/>
  <circle cx="58" cy="70" r="8" fill="white" fill-opacity="0.14"/>

  <!-- Workbench -->
  <rect x="24" y="186" width="272" height="10" rx="5" fill="white" fill-opacity="0.85"/>
  <rect x="48" y="196" width="10" height="20" rx="3" fill="white" fill-opacity="0.5"/>
  <rect x="262" y="196" width="10" height="20" rx="3" fill="white" fill-opacity="0.5"/>

